name: role
version: 1.0.0
enabled: true
prefix: /api/roles
description: Staff and system roles
schema: core

routes:
  - method: POST
    path: /
    action: create
    auth: true
    cache: false
  - method: GET
    path: /
    action: findAll
    auth: true
    cache: true
    ttl: 60
  - method: GET
    path: /code/:code
    action: findByCode
    auth: true
    cache: true
    ttl: 120
  - method: GET
    path: /:id
    action: findById
    auth: true
    cache: true
    ttl: 60
  - method: PATCH
    path: /:id
    action: update
    auth: true
    cache: false
  - method: DELETE
    path: /:id
    action: softDelete
    auth: true
    cache: false
