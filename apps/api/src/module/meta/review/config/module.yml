name: review
version: 1.0.0
enabled: true
prefix: /api/reviews
description: Product reviews in meta schema
schema: meta

routes:
  - method: POST
    path: /
    action: create
    auth: false
    cache: false
  - method: GET
    path: /summary
    action: summary
    auth: false
    cache: true
    ttl: 120
  - method: GET
    path: /admin
    action: findAllAdmin
    auth: true
    cache: true
    ttl: 60
  - method: GET
    path: /
    action: findAll
    auth: false
    cache: true
    ttl: 120
  - method: GET
    path: /:id
    action: findById
    auth: false
    cache: true
    ttl: 120
  - method: PATCH
    path: /:id/approve
    action: approve
    auth: true
    cache: false
  - method: PATCH
    path: /:id
    action: update
    auth: true
    cache: false
  - method: DELETE
    path: /:id
    action: softDelete
    auth: true
    cache: false

security:
  encrypt: true
  rate_limit:
    window_ms: 60000
    max: 40
