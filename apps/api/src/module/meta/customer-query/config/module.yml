name: customer-query
version: 1.0.0
enabled: true
prefix: /api/customer-queries
description: Customer support queries tracked in meta schema
schema: meta

routes:
  - method: POST
    path: /
    action: create
    auth: false
    cache: false
  - method: GET
    path: /summary
    action: summary
    auth: true
    cache: true
    ttl: 300
  - method: GET
    path: /
    action: findAll
    auth: true
    cache: true
    ttl: 300
  - method: GET
    path: /:id
    action: findById
    auth: true
    cache: true
    ttl: 300
  - method: PATCH
    path: /:id
    action: update
    auth: true
    cache: false
  - method: DELETE
    path: /:id
    action: softDelete
    auth: true
    cache: false

security:
  encrypt: true
