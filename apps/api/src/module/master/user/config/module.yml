name: user
version: 1.0.0
enabled: true
prefix: /api/users
description: Users with role and user-type identity
schema: master

routes:
  - method: POST
    path: /
    action: create
    auth: false
  - method: GET
    path: /
    action: findAll
    auth: true
    roles: [STAFF, ADMIN]
  - method: GET
    path: /:id
    action: findById
    auth: true

related:
  roles:
    prefix: /api/roles
  user_types:
    prefix: /api/user-types

security:
  encrypt: true
  rate_limit:
    window_ms: 60000
    max: 60

features:
  phone_lookup: true
  audit_fields: true
  identity:
    role: true
    user_type: true
  defaults:
    role_code: CUSTOMER
    user_type_code: INDIVIDUAL
