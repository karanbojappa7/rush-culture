name: category
version: 1.0.0
enabled: true
prefix: /api/categories
description: Product categories in master schema
schema: master

routes:
  - method: GET
    path: /
    action: findAll
    auth: false
    cache: true
    ttl: 300
  - method: GET
    path: /slug/:slug
    action: findBySlug
    auth: false
    cache: true
    ttl: 300
  - method: GET
    path: /:id
    action: findById
    auth: false
    cache: true
    ttl: 300
  - method: POST
    path: /
    action: create
    auth: true
    cache: false
  - method: PATCH
    path: /:id
    action: update
    auth: true
    cache: false
  - method: DELETE
    path: /:id
    action: softDelete
    auth: true
    cache: false

security:
  encrypt: true

features:
  tree: true
