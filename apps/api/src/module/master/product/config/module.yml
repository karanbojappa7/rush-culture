name: product
version: 1.0.0
enabled: true
prefix: /api/products
description: Catalog products with size and color variants

routes:
  - method: GET
    path: /
    action: findAll
    auth: false
    cache: true
    ttl: 60
    query:
      - q
      - collection
      - size
      - color
      - minPrice
      - maxPrice
  - method: GET
    path: /id/:id
    action: findById
    auth: false
    cache: true
    ttl: 60
  - method: GET
    path: /:slug
    action: findBySlug
    auth: false
    cache: true
    ttl: 60
  - method: POST
    path: /
    action: create
    auth: true
    cache: false
  - method: POST
    path: /stock-check
    action: checkStock
    auth: false
    cache: false
  - method: PATCH
    path: /:id
    action: update
    auth: true
    cache: false
  - method: PATCH
    path: /:id/variants
    action: replaceVariants
    auth: true
    cache: false
  - method: PATCH
    path: /:id/images
    action: replaceImages
    auth: true
    cache: false
  - method: DELETE
    path: /:id
    action: softDelete
    auth: true
    cache: false

security:
  encrypt: true
  rate_limit:
    window_ms: 60000
    max: 120

features:
  filters: true
  variants: true
  stock_check: true

schema: master
